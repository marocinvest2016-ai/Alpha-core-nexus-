name: Dana Agent
on:
  workflow_dispatch:  # تشغيل يدوي
  schedule:
    - cron: '0 */6 * * *' # كل 6 ساعات

jobs:
  run-dana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DANA_GITHUB_TOKEN }}
      - name: Dana Start
        run: |
          echo "Dana is online. Starting work in Alpha-core-nexus-"
          git config user.name "DANA-AGENT"
          git config user.email "dana@tdl.local"
